<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Habit Tracker</title>
  <meta name="description" content="A two-person habit tracker: your habits, their habits, and shared habits you both have to check off." />
  <meta name="theme-color" content="#0a0b0d" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="picker" class="picker" hidden></div>
  <div id="app" class="app" hidden>
    <header class="app-head">
      <div class="head-text">
        <p id="hello" class="hello"></p>
        <h1 id="who-title" tabindex="-1">Habit Tracker</h1>
      </div>
      <canvas id="avatar" class="avatar" width="64" height="96" aria-hidden="true"></canvas>
    </header>
    <p id="banner" class="banner" role="alert" hidden></p>
    <section id="nudges" class="nudges" aria-label="Nudges" hidden></section>
    <main id="view"></main>
    <nav id="tabbar" class="tabbar" aria-label="Sections">
      <button type="button" data-tab="me">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></svg>
        <span class="tab-label">Me</span>
      </button>
      <button type="button" data-tab="shared">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.4A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
        <span class="tab-label">Shared</span>
      </button>
      <button type="button" data-tab="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
        <span class="tab-label">Calendar</span>
      </button>
      <button type="button" data-tab="partner" id="partner-tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.7-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
        <span class="tab-label">Partner</span>
      </button>
      <button type="button" id="switch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h13l-3-3M20 15H7l3 3"/></svg>
        <span class="tab-label">Switch</span>
      </button>
    </nav>
    <p id="status" class="sr-only" aria-live="polite"></p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
