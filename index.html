<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Habit Tracker</title>
  <meta name="description" content="A two-person habit tracker: your habits, their habits, and shared habits you both have to check off." />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="picker" class="picker" hidden></div>
  <div id="app" class="app" hidden>
    <header class="app-head">
      <h1 id="who-title" tabindex="-1">Habit Tracker</h1>
    </header>
    <p id="banner" class="banner" role="alert" hidden></p>
    <section id="nudges" class="nudges" aria-label="Nudges" hidden></section>
    <main id="view"></main>
    <nav id="tabbar" class="tabbar" aria-label="Sections">
      <button type="button" data-tab="me">Me</button>
      <button type="button" data-tab="shared">Shared</button>
      <button type="button" data-tab="calendar">Calendar</button>
      <button type="button" data-tab="partner" id="partner-tab">Partner</button>
      <button type="button" id="switch">Switch</button>
    </nav>
    <p id="status" class="sr-only" aria-live="polite"></p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
